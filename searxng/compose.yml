# Private meta-search for the agent. Bound to localhost only.
# First run: echo "SEARXNG_SECRET=$(openssl rand -hex 32)" > .env && docker compose up -d
services:
  searxng:
    image: searxng/searxng:2026.10.27-b5ed73fcb
    restart: unless-stopped
    ports:
      - "127.0.0.1:8888:8080"
    environment:
      - SEARXNG_SECRET=${SEARXNG_SECRET:?run the first-run line at the top of this file}
    volumes:
      - ./settings.yml:/etc/searxng/settings.yml:ro
